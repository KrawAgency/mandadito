        '<div class="reg-field">' +
          '<label class="reg-label">Cant.</label>' +
          '<input class="reg-input" type="number" value="' + (item.cantidad||1) + '" onchange="regItems[' + idx + '].cantidad=parseInt(this.value)||1">' +
        '</div>' +
      '</div>' +
      '<div class="reg-field">' +
        '<label class="reg-label">Notas</label>' +
        '<input class="reg-input" value="' + (item.notas||'').replace(/"/g,'&quot;') + '" onchange="regItems[' + idx + '].notas=this.value">' +
      '</div>' +
    '</div>';
  }).join('');
}

function regParsear() {
  var txt = document.getElementById('reg-json-input').value.trim();
  try {
    var data = JSON.parse(txt);
    regMeta = {
      tipo:   data.tipo   || 'ticket',
      tienda: data.tienda || '',
      fecha:  data.fecha  || '',
      total:  data.total  || 0,
      ahorro: data.ahorro || 0,
      notas:  data.notas  || '',
    };
    regItems = (data.items || []).map(function(it) {
      return {
        producto:     it.producto     || '',
        categoria:    it.categoria    || '',
        subcategoria: it.subcategoria || '',
        presentacion: it.presentacion || '',
        precio:       it.precio       || 0,
        cantidad:     it.cantidad     || 1,
        notas:        it.notas        || '',
        tipo:         it.tipo         || 'compra',
        confianza:    it.confianza    || 'alta',
      };
    });
    regRefreshModal();
  } catch(e) {
    alert('JSON inválido. Revisa que esté bien formado.\n\n' + e.message);
  }
}

function regRefreshModal() {
  var overlay = document.getElementById('reg-overlay');
  if (overlay) overlay.innerHTML = regRenderModal();
}

function regRefreshFooter() {
  var ambiguos = regItems.filter(function(it) { return it.confianza === 'baja'; }).length;
  var btn = document.getElementById('reg-btn-confirm');
  if (!btn) return;
  btn.disabled = regItems.length === 0 || ambiguos > 0;
  btn.textContent = ambiguos > 0
    ? 'Resuelve ' + ambiguos + ' ítem' + (ambiguos>1?'s':'') + ' primero'
    : 'Guardar en Firebase (' + regItems.length + ' ítems)';
}

function regResolverItem(idx) {
  regPickerIdx = idx;
  // Reutilizar el picker existente pero en modo "resolver ambigüedad"
  pickerSeleccionados = [];
  pickerCatActiva = regItems[idx].categoria || 'Todos';
  pickerBusqueda = '';
  var overlay = document.createElement('div');
  overlay.className = 'picker-overlay';
  overlay.id = 'reg-picker-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) regCerrarPicker(); };
  overlay.innerHTML = regPickerHTML();
  document.body.appendChild(overlay);
}

function regPickerHTML() {
  // Igual que pickerRenderHTML pero el botón confirma en regConfirmarPicker
  var cats = pickerCategorias();
  var prods = pickerFiltrar();

  var catsHTML = cats.map(function(c) {
    return '<button class="picker-cat' + (c === pickerCatActiva ? ' active' : '') +
      '" onclick="pickerCatActiva=\'' + c.replace(/'/g,"\\'") + '\';regRefreshPicker()">' + c + '</button>';
  }).join('');

  var itemsHTML = prods.map(function(p) {
    var sel = pickerSeleccionados.indexOf(p.producto) !== -1;
    var cls = 'picker-item' + (sel ? ' selected' : '');
    return '<div class="' + cls + '" onclick="regPickerToggle(\'' + p.producto.replace(/'/g,"\\'") + '\')">' +
      '<span class="picker-item-emoji">' + pickerGetEmoji(p.categoria) + '</span>' +
      '<span class="picker-item-nombre">' + p.producto + '</span>' +
      '<span class="picker-item-check">' + (sel ? '✓' : '') + '</span>' +
    '</div>';
  }).join('') || '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px;">Sin resultados</div>';

  return '<div class="picker-modal">' +
    '<div class="picker-header">' +
      '<div class="picker-title">🔍 ¿Qué producto es este?</div>' +
      '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">Identificando: <strong>' + (regItems[regPickerIdx]||{}).producto + '</strong></div>' +
      '<div class="picker-cats">' + catsHTML + '</div>' +
      '<input class="picker-search" placeholder="Buscar en catálogo…" value="' + pickerBusqueda + '" oninput="pickerBusqueda=this.value;regRefreshPicker()" autocomplete="off">' +
    '</div>' +
    '<div class="picker-body"><div class="picker-grid" id="reg-picker-grid">' + itemsHTML + '</div></div>' +
    '<div class="picker-footer">' +
      '<button onclick="regNuevoDesdeModal()" ' +
        'style="background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:12px;font-family:\'DM Sans\',sans-serif;cursor:pointer;">＋ Producto nuevo</button>' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="picker-btn-cancel" onclick="regCerrarPicker()">Cancelar</button>' +
        '<button class="picker-btn-add" onclick="regConfirmarPicker()" ' + (pickerSeleccionados.length===0?'disabled':'') + '>Confirmar</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function regPickerToggle(nombre) {
  pickerSeleccionados = [nombre]; // solo uno a la vez
  regRefreshPicker();
}

function regRefreshPicker() {
  var overlay = document.getElementById('reg-picker-overlay');
  if (!overlay) return;

  var prods = pickerFiltrar();
  var itemsHTML = prods.map(function(p) {
    var sel = pickerSeleccionados.indexOf(p.producto) !== -1;
    var cls = 'picker-item' + (sel ? ' selected' : '');
    return '<div class="' + cls + '" onclick="regPickerToggle(\'' + p.producto.replace(/'/g,"\\'") + '\')">' +
      '<span class="picker-item-emoji">' + pickerGetEmoji(p.categoria) + '</span>' +
      '<span class="picker-item-nombre">' + p.producto + '</span>' +
      '<span class="picker-item-check">' + (sel ? '✓' : '') + '</span>' +
    '</div>';
  }).join('') || '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px;">Sin resultados</div>';

  var grid = overlay.querySelector('.picker-grid');
  if (grid) grid.innerHTML = itemsHTML;

  var count = overlay.querySelector('.picker-count');
  if (count) count.textContent = pickerSeleccionados.length > 0 ? pickerSeleccionados[0] : 'Selecciona un producto';

  var btn = overlay.querySelector('.picker-btn-add');
  if (btn) btn.disabled = pickerSeleccionados.length === 0;

  overlay.querySelectorAll('.picker-cat').forEach(function(el) {
    el.classList.toggle('active', el.textContent === pickerCatActiva);
  });
}

function regConfirmarPicker() {
  if (pickerSeleccionados.length === 0 || regPickerIdx === null) return;
  var nombreElegido = pickerSeleccionados[0];
  var prod = CATALOGO.find(function(p) { return p.producto === nombreElegido; });
  if (prod && regItems[regPickerIdx]) {
    regItems[regPickerIdx].producto     = prod.producto;
    regItems[regPickerIdx].categoria    = prod.categoria;
    regItems[regPickerIdx].subcategoria = prod.subcategoria || '';
    regItems[regPickerIdx].presentacion = prod.presentacion || regItems[regPickerIdx].presentacion;
    regItems[regPickerIdx].confianza    = 'alta';
  }
  regCerrarPicker();
  regRefreshModal();
}

function regNuevoDesdeModal() {
  var idx = regPickerIdx;
  var nombreActual = idx !== null ? regItems[idx].producto : '';
  regCerrarPicker();
  // Pequeño delay para que el picker cierre antes de abrir el mini modal
  setTimeout(function() {
    regNuevoProducto(idx, nombreActual);
  }, 100);
}
  
function regCerrarPicker() {
  var o = document.getElementById('reg-picker-overlay');
  if (o) o.remove();
  regPickerIdx = null;
}

function regConfirmar() {
  if (!window._fbWrite) { alert('Firebase no está listo'); return; }
  var fecha   = document.getElementById('reg-fecha')  ? document.getElementById('reg-fecha').value  : regMeta.fecha;
  var tienda  = document.getElementById('reg-tienda') ? document.getElementById('reg-tienda').value : regMeta.tienda;
  var total   = document.getElementById('reg-total')  ? parseFloat(document.getElementById('reg-total').value)||0  : regMeta.total;
  var ahorro  = document.getElementById('reg-ahorro') ? parseFloat(document.getElementById('reg-ahorro').value)||0 : regMeta.ahorro;
  var notas   = document.getElementById('reg-notas')  ? document.getElementById('reg-notas').value  : regMeta.notas;

  var ts = Date.now();

  // Escribir cada ítem en tickets
  var ticketsNuevos = {};
  regItems.forEach(function(item, i) {
    var key = 't_' + ts + '_' + i;
    ticketsNuevos[key] = {
      fecha:        fecha,
      tienda:       tienda,
      ciudad: document.getElementById('reg-ciudad') ? document.getElementById('reg-ciudad').value : regInferirCiudad(tienda),
      producto:     item.producto,
      categoria:    item.categoria,
      subcategoria: item.subcategoria || '',
      presentacion: item.presentacion || '',
      precio:       item.precio,
      cantidad:     item.cantidad || 1,
      notas:        item.notas || '',
      tipo:         item.tipo || 'compra',
    };
    // Ligar con la sesión que se escribe abajo (misma clave s_{ts})
    if (regMeta.tipo !== 'observacion' && total > 0 && ticketsNuevos[key].tipo === 'compra') {
      ticketsNuevos[key].sesion = 's_' + ts;
    }
    // También actualizar catálogo si no existe
    var yaEnCatalogo = CATALOGO.some(function(c) {
      return c.producto.toLowerCase() === item.producto.toLowerCase() && c.tienda === tienda;
    });
    if (!yaEnCatalogo) {
      window._fbWrite('catalogo/c_' + ts + '_' + i, {
        producto:     item.producto,
        categoria:    item.categoria,
        subcategoria: item.subcategoria || '',
        presentacion: item.presentacion || '',
        tienda:       tienda,
        ciudad:       document.getElementById('reg-ciudad') ? document.getElementById('reg-ciudad').value : regInferirCiudad(tienda),
        precio:       item.precio,
        precioUnidad: '',
        notas:        item.notas || '',
      });
    }
  });

  // Escribir todos los tickets de una vez
  Object.keys(ticketsNuevos).forEach(function(key) {
    window._fbWrite('tickets/' + key, ticketsNuevos[key]);
  });

  // Escribir sesión si es ticket (no observación)
  if (regMeta.tipo !== 'observacion' && total > 0) {
    var cfg = CONFIG_TIENDAS[tienda] || {};
    window._fbWrite('sesiones/s_' + ts, {
      tienda:           tienda,
      etiquetaOriginal: cfg.etiqueta || tienda,
      fecha:            fecha,
      total:            total,
      ahorro:           ahorro,
      notas:            notas || regItems.length + ' artículos',
    });
  }

  // Actualizar variables locales
  regItems.forEach(function(item, i) {
    var key = 't_' + ts + '_' + i;
    TICKETS.push(ticketsNuevos[key]);
  });

  regCerrar();
  alert('✅ ' + regItems.length + ' ítems guardados en Firebase');
}

function regCerrar() {
  var o = document.getElementById('reg-overlay');
  if (o) o.remove();
  regItems = [];
  regMeta  = {};
  regPickerIdx = null;
}
// ══════════════════════════════════════════════════════════════
  
// ══════════════════════════════════════════════════════════════
// ARRANQUE
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// MÓDULO: DUDAS (tickets por foto)
// Los tickets se guardan solos (tools/aplicar.py). Aquí solo llegan los
// renglones que la lectura no pudo decidir: una pregunta por texto de
// ticket (pipeline/preguntas). Contestar escribe pipeline/respuestas/{id};
// la siguiente corrida de aplicar.py corrige esos artículos.
// ══════════════════════════════════════════════════════════════
var DUDAS = null;       // { id: pregunta }
var RESPUESTAS = {};    // { id: respuesta } ya contestadas, aún sin aplicar

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// Nombres conocidos para el autocompletado (catálogo + tickets)
function nombresConocidos() {
  var vistos = {};
  CATALOGO.concat(TICKETS).forEach(function(r) { if (r.producto) vistos[r.producto] = 1; });
  return Object.keys(vistos).sort(function(a, b) { return a.localeCompare(b, 'es'); });
}

function dudasAbiertas() {
  return DUDAS ? Object.keys(DUDAS).filter(function(id) { return !RESPUESTAS[id]; }) : [];
}

function dudasActualizarTab() {
  var n = dudasAbiertas().length;
  var tab = document.querySelector('.tab-item[data-tab="dudas"]');
  if (!tab) return;
  var globo = tab.querySelector('.tab-cuenta');
  if (!globo) {
    globo = document.createElement('span');
    globo.className = 'tab-cuenta';
    tab.appendChild(globo);
  }
  globo.textContent = n;
  globo.style.display = n ? '' : 'none';
}

function dudasCargar() {
  return Promise.all([window._fbGet('pipeline/preguntas'), window._fbGet('pipeline/respuestas')])
    .then(function(r) {
      DUDAS = r[0] || {};
      RESPUESTAS = r[1] || {};
      dudasActualizarTab();
    });
}

function dudasRender() {
  var cont = document.getElementById('tbl-dudas');
  if (!cont) return;
  if (DUDAS === null) {
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    dudasCargar().then(dudasRender);
    return;
  }
  var ids = dudasAbiertas();
  var cnt = document.getElementById('cnt-dudas');
  if (cnt) cnt.textContent = ids.length ? ids.length + (ids.length === 1 ? ' pregunta' : ' preguntas') : 'al día';
  if (!ids.length) {
    cont.innerHTML = '<div class="vacio"><div style="font-size:34px">✅</div>' +
      '<b>Todo al día</b><br>Los tickets nuevos se guardan solos. Si algún renglón no se puede leer con seguridad, aparece aquí.</div>';
    return;
  }
  cont.innerHTML = '<div class="dudas-intro">Solo dime qué es cada uno. Lo demás de esos tickets ya está guardado.</div>' +
    '<datalist id="dudas-productos">' + nombresConocidos().map(function(n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    ids.sort(function(a, b) { return (DUDAS[b].fecha || '').localeCompare(DUDAS[a].fecha || ''); }).map(dudaHTML).join('');
}

function dudaHTML(id) {
  var q = DUDAS[id];
  var veces = (q.items || []).length;
  var ops = (q.opciones || []).map(function(o, n) {
    return '<button class="duda-op' + (o.quitar ? ' quitar' : '') + '" onclick="dudaResponder(\'' + id + '\',' + n + ')">' +
      esc(o.quitar ? (o.etiqueta || 'No contarlo') : o.producto) + '</button>';
  }).join('');
  return '<div class="duda-card" id="duda-' + id + '">' +
    '<div class="duda-top">' + renderBadgeTienda(q.tienda) +
      '<span>' + fechaBonita(q.fecha) + ' · ' + formatearPrecio(q.precio) + (veces > 1 ? ' · en ' + veces + ' tickets' : '') + '</span></div>' +
    '<div class="duda-texto">' + esc(q.texto) + '</div>' +
    (q.porque ? '<div class="duda-porque">' + esc(q.porque) + '</div>' : '') +
    '<div class="duda-ops">' + ops + '</div>' +
    '<div class="duda-otro">' +
      '<input class="edit-input" list="dudas-productos" placeholder="Otro producto…" id="duda-otro-' + id + '">' +
      '<button class="icon-btn" onclick="dudaResponderOtro(\'' + id + '\')">Guardar</button>' +
    '</div>' +
    '<button class="duda-foto-btn" onclick="dudaVerFoto(\'' + id + '\', this)">📷 Ver el ticket</button>' +
    '<div id="duda-foto-' + id + '"></div>' +
  '</div>';
}

function dudaGuardar(id, respuesta) {
  respuesta.respondido_en = new Date().toISOString();
  var card = document.getElementById('duda-' + id);
  if (card) card.classList.add('respondida');
  window._fbWrite('pipeline/respuestas/' + id, respuesta).then(function() {
    RESPUESTAS[id] = respuesta;
    dudasActualizarTab();
    toast('✓ Anotado. Se corrige en la próxima actualización.');
    setTimeout(dudasRender, 350);
  }).catch(function(e) {
    if (card) card.classList.remove('respondida');
    alert('No se pudo guardar: ' + e.message);
  });
}

function dudaResponder(id, n) {
  var o = DUDAS[id].opciones[n];
  dudaGuardar(id, o.quitar ? { quitar: true } : {
    producto: o.producto, categoria: o.categoria || '', subcategoria: o.subcategoria || '',
    presentacion: o.presentacion || ''
  });
}

function dudaResponderOtro(id) {
  var input = document.getElementById('duda-otro-' + id);
  var nombre = (input && input.value || '').trim();
  if (!nombre) { if (input) input.focus(); return; }
  // Si el nombre ya existe, se hereda su categoría
  var conocido = CATALOGO.concat(TICKETS).find(function(r) { return r.producto === nombre; });
  var base = DUDAS[id].opciones[0] || {};
  dudaGuardar(id, {
    producto: nombre,
    categoria: conocido ? conocido.categoria : (base.categoria || 'Por identificar'),
    subcategoria: conocido ? (conocido.subcategoria || '') : (base.subcategoria || '')
  });
}

function dudaVerFoto(id, btn) {
  var cont = document.getElementById('duda-foto-' + id);
  var foto = (DUDAS[id].fotos || [])[0];
  if (!cont || !foto) return;
  btn.textContent = 'Cargando…';
  window._fbGet('pipeline/imagenes/' + foto).then(function(d) {
    var imgs = (d && d.imagenes) || [];
    cont.innerHTML = imgs.map(function(b64) { return '<img class="duda-img" src="data:image/jpeg;base64,' + b64 + '">'; }).join('') ||
      '<div class="tk-sub">Sin foto.</div>';
    btn.style.display = 'none';
  });
}

function toast(texto) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = texto;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2800);
}

cargarDatos()
  .then(function() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('sheetsContainer').style.display = '';
    document.getElementById('header-sub').textContent =
      SESIONES.length + ' tickets · ' + TICKETS.length + ' artículos · ' + CATALOGO.length + ' en catálogo';
    inicializar();
    // Solo el conteo para la pestaña; las fotos se bajan al pedirlas
    dudasCargar();
  })
  .catch(function(err) {
    var ol = document.getElementById('loading-overlay');
    if (ol) ol.innerHTML =
      '<div style="text-align:center;padding:32px;max-width:420px;">' +
      '<div style="font-size:32px;margin-bottom:16px;">⚠️</div>' +
      '<div style="font-family:inherit;font-size:20px;color:var(--accent);margin-bottom:12px;">Error al cargar datos</div>' +
      '<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">' + err.message + '</div>' +
      '<div style="font-size:11px;color:var(--text3);">Revisa la conexión a internet y vuelve a abrir la app. Los datos están en Firebase (compras-visor).</div>' +
      '</div>';
    console.error('cargarDatos error:', err);
  });
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
