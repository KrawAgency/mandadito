<title>🛒 Mandadito</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkPuXF9YnKDWcserGgR0S2guPbaXgghwc",
    authDomain: "compras-visor.firebaseapp.com",
    databaseURL: "https://compras-visor-default-rtdb.firebaseio.com",
    projectId: "compras-visor",
    storageBucket: "compras-visor.firebasestorage.app",
    messagingSenderId: "29245001509",
    appId: "1:29245001509:web:de0ad152d51f88b949d4cc"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const listaRef = ref(db, 'lista');

  // Expone funciones al scope global para que el resto del HTML las use
  window._fbSet    = (items) => set(listaRef, items);
  window._fbRemove = () => remove(listaRef);
  window._fbListen = (cb) => onValue(listaRef, snap => cb(snap.val()));

  // Lectura one-time de cualquier nodo
  window._fbGet = (nodo) => new Promise((res, rej) => {
    const r = ref(db, nodo);
    onValue(r, snap => res(snap.val()), { onlyOnce: true });
  });

  // Escritura en cualquier nodo
  window._fbWrite = (nodo, data) => set(ref(db, nodo), data);
  // Señal de que Firebase está listo
  window._fbListo = true;
  document.dispatchEvent(new Event('firebase-listo'));
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root {
    /* Paleta del logo: crema, naranja y café */
    --bg: #FFF6EC; --surface: #FFFFFF; --surface2: #FFF0E0;
    --border: #F0DCC6; --accent: #EE5A1F; --accent-dark: #D9480F; --green: #1E8E3E;
    --red: #D63B2F; --purple: #7B5BD6; --blue: #2F6FDB; --warn: #B86E00;
    --teal: #13998F; --text: #2B1A14; --text2: #6B5246; --text3: #A08877;
    --sombra: 0 2px 10px rgba(120,60,20,0.08);
    --tab-height: 64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; }
  button, input, select, textarea { font-family: inherit; }
  
  /* ── Header ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: var(--sombra); }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-icono { width: 42px; height: 42px; flex-shrink: 0; }
  .header-texto { height: 24px; display: block; }
  .header-sub { color: var(--text3); font-size: 12px; display: block; margin-top: 2px; }
  .icon-btn { background: var(--surface2); color: var(--accent-dark); border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .icon-btn:hover { border-color: var(--accent); }
  .dl-btn { background: var(--accent); color: #fff; border: none; padding: 9px 20px; border-radius: 8px; font-family:inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: all 0.2s; text-decoration: none; }
  .dl-btn:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(238,90,31,0.35); }
  
  /* ── Summary bar ── */
  .summary-bar { display: none; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; flex: 1; min-width: 140px; }
  .stat-card-label { color: var(--text3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .stat-card-value { font-family:inherit; font-size: 22px; font-weight: 700; }
  .stat-card-value.green { color: var(--green); }
  .stat-card-value.accent { color: var(--accent); }
  .stat-card-sub { color: var(--text3); font-size: 12px; margin-top: 4px; }

  /* ── Sheet blocks ── */
  .sheets-container { padding-bottom: var(--tab-height); }
  .sheet-block { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--sombra); }
  .sheet-title { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; gap: 10px; }
  .sheet-title-left { display: flex; align-items: center; gap: 10px; }
  .sheet-name { font-family:inherit; font-size: 17px; font-weight: 700; }
  .sheet-count { background: var(--bg); color: var(--text3); font-size: 12px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); }
  /* ── Toolbar ── */
  .sheet-toolbar { padding: 12px 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px 7px 32px; color: var(--text); font-family:inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; pointer-events: none; }
  .filter-select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text2); font-family:inherit; font-size: 14px; outline: none; cursor: pointer; }
  
  /* ── Tables ── */
  .table-scroll { overflow-x: auto; overflow-y: auto; height: 62vw; max-height: 720px; min-height: 320px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { background: var(--surface2); color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 13px; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); white-space: nowrap; }  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: rgba(238,90,31,0.04); }
  tbody td { padding: 9px 13px; vertical-align: top; line-height: 1.5; }

  /* ── Tienda color stripes ── */
  tr.row-costco  td:first-child { border-left: 3px solid var(--green); }
  tr.row-walmart td:first-child { border-left: 3px solid var(--blue); }
  tr.row-chedraui td:first-child { border-left: 3px solid var(--accent); }
  tr.row-aki     td:first-child { border-left: 3px solid var(--purple); }
  tr.row-ml      td:first-child { border-left: 3px solid var(--red); }
  tr.row-chedpm  td:first-child { border-left: 3px solid var(--teal); }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-costco  { background: rgba(30,142,62,0.15);  color: var(--green); }
  .badge-walmart { background: rgba(91,155,213,0.15);  color: #5b9bd5; }
  .badge-chedraui{ background: rgba(184,110,0,0.15);  color: var(--warn); }
  .badge-aki     { background: rgba(123,91,214,0.15); color: var(--purple); }
  .badge-ml      { background: rgba(224,82,82,0.15);   color: var(--red); }
  .badge-chedpm  { background: rgba(42,181,181,0.15);  color: #2ab5b5; }

  /* ── Special rows ── */
  .price-cell { font-family:inherit; font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .note-promo { color: var(--green); font-size: 13px; }
  .note-warn  { color: var(--warn); font-size: 13px; }
  .note-obs   { color: var(--text3); font-size: 13px; }
  tr.section-hdr td   { background: var(--surface2); color: var(--text3); font-size: 12px; font-weight: 600; letter-spacing: 0.4px; padding: 7px 13px; }
  tr.subtotal-row td  { font-weight: 700; color: var(--accent); background: rgba(238,90,31,0.05); font-size: 14px; }
  
  /* ── Resumen table ── */
  .resumen-table td:nth-child(3),
  .resumen-table td:nth-child(4) { font-family:inherit; font-size: 15px; }
  .resumen-table tr.total-row td { border-top: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 16px; }
  .savings-val { color: var(--green) !important; }

  /* ── Guia table ── */
  .guia-table td:first-child { white-space: nowrap; color: var(--accent); font-weight: 600; padding-right: 24px; width: 220px; }
  .guia-table td { color: var(--text2); padding: 10px 13px; }

  /* ── Legend ── */
  .legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text3); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    .sheets-container { padding: 0; }
    .header { padding: 13px 16px; }
    .summary-bar { padding: 14px 16px; }
    .table-scroll { height: 85vw; max-height: 500px; }
  }

  /* ══════════════════════════════════════════════════════
     MÓDULO: LISTA DE COMPRAS
  ══════════════════════════════════════════════════════ */

  /* Layout de dos columnas dentro del bloque */
  .lista-layout { display: grid; grid-template-columns: 1fr 290px; gap: 20px; padding: 20px; align-items: start; }

  /* Input con autocomplete */
  .lista-input-wrap { position: relative; margin-bottom: 14px; }
  .lista-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-family:inherit; font-size: 15px; outline: none; transition: border-color 0.2s; }
  .lista-input:focus { border-color: var(--accent); }
  .lista-input::placeholder { color: var(--text3); }

  /* Dropdown */
  .lista-dropdown { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; z-index: 400; display: none; box-shadow: 0 8px 28px rgba(120,60,20,0.18); }
  .lista-dropdown.visible { display: block; }
  .ldd-item { padding: 9px 14px; cursor: pointer; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .ldd-item:last-child { border-bottom: none; }
  .ldd-item:hover, .ldd-item.ldd-active { background: var(--surface); }
  .ldd-nombre { color: var(--text); font-size: 12px; flex: 1; min-width: 0; white-space: normal; word-break: break-word; }
  .ldd-meta { color: var(--text3); font-size: 11px; white-space: nowrap; flex-shrink: 0; }
  .ldd-libre { font-style: italic; color: var(--text3); }

  /* Items de la lista */
  .lista-items { display: flex; flex-direction: column; gap: 7px; }
  .litem-drag { color: var(--text3); font-size: 18px; padding: 0 6px; cursor: grab; flex-shrink: 0; touch-action: none; }
  .lista-vacia { text-align: center; padding: 32px 16px; color: var(--text3); font-size: 14px; font-style: italic; border: 1px dashed var(--border); border-radius: 10px; }
  .litem-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.15s; }
  .litem-card:hover { border-color: var(--accent); }
  .litem-header { display: flex; align-items: center; padding: 9px 12px; gap: 9px; }
  .litem-check { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; cursor: pointer; flex-shrink: 0; transition: all 0.18s; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; }
  .litem-check.litem-checked { background: var(--green); border-color: var(--green); }
 .litem-nombre { font-size: 15px; color: var(--text); flex: 1; min-width: 0; cursor: pointer; white-space: normal; word-break: break-word; line-height: 1.4; }
  .litem-nombre.litem-tachado { text-decoration: line-through; color: var(--text3); }
  .litem-mejor { font-size: 13px; color: var(--green); white-space: nowrap; flex-shrink: 0; }
  .litem-expand { color: var(--text3); background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 5px; transition: color 0.15s; flex-shrink: 0; align-self: flex-start; }
  .litem-expand:hover { color: var(--accent); }
  .litem-remove { color: var(--text3); background: none; border: none; cursor: pointer; font-size: 19px; padding: 2px 4px; line-height: 1; transition: color 0.15s; flex-shrink: 0; align-self: flex-start; }
  .litem-remove:hover { color: var(--red); }
  .litem-precios { border-top: 1px solid var(--border); padding: 11px 12px; display: none; }
  .litem-precios.litem-abierto { display: block; }
  .litem-precios-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .lprecio-fila { display: flex; align-items: flex-start; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 8px; }
  .lprecio-fila:last-child { border-bottom: none; }
  .lprecio-tienda { display: flex; align-items: center; gap: 6px; }
  .lprecio-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
 .lprecio-tienda-nom { font-size: 14px; color: var(--text2); }
  .lprecio-mejor-badge { font-size: 11px; background: rgba(30,142,62,0.15); color: var(--green); padding: 2px 7px; border-radius: 10px; border: 1px solid rgba(30,142,62,0.25); margin-left: 4px; }
  .lprecio-der { text-align: right; }
  .lprecio-monto { font-family:inherit; font-size: 16px; font-weight: 700; color: var(--accent); }
  .lprecio-monto.lprecio-es-mejor { color: var(--green); }
  .lprecio-nota { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .litem-sin-precios { font-size: 13px; color: var(--text3); font-style: italic; }
  
  /* Ruta sugerida (columna derecha) */
  .ruta-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: sticky; top: 72px; }
  .ruta-box-header { padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .ruta-box-title { font-family:inherit; font-size: 16px; font-weight: 700; }
  .ruta-box-sub { font-size: 13px; color: var(--text3); }
  .ruta-vacia { padding: 24px 16px; text-align: center; color: var(--text3); font-size: 14px; font-style: italic; }
  .ruta-tienda-bloque { border-bottom: 1px solid var(--border); }
  .ruta-tienda-bloque:last-of-type { border-bottom: none; }
  .ruta-tienda-hdr { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; }
  .ruta-tienda-izq { display: flex; align-items: center; gap: 7px; }
  .ruta-tdot { width: 7px; height: 7px; border-radius: 50%; }
  .ruta-tnombre { font-size: 14px; font-weight: 500; }
  .ruta-tcuenta { font-size: 13px; color: var(--text3); }
  .ruta-tsubtotal { font-family:inherit; font-size: 16px; font-weight: 700; color: var(--accent); }
  .ruta-items-det { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 3px; }
  .ruta-item-lin { display: flex; align-items: flex-start; justify-content: space-between; font-size: 13px; color: var(--text2); gap: 8px; }
  .ruta-item-lin-nom { word-break: break-word; flex: 1; }
  .ruta-item-lin-precio { color: var(--green); white-space: nowrap; flex-shrink: 0; }
  .ruta-sin-datos { padding: 8px 16px; font-size: 13px; color: var(--text3); font-style: italic; border-top: 1px solid var(--border); }
  .ruta-total-bar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid var(--border); background: var(--surface); }
  .ruta-total-label { font-size: 14px; color: var(--text2); }
  .ruta-total-valor { font-family:inherit; font-size: 20px; font-weight: 800; color: var(--accent); }

  /* Modal catálogo picker */
  .picker-overlay { position:fixed;inset:0;background:rgba(43,26,20,0.45);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px; }
  .picker-modal { background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden; }
  .picker-header { padding:18px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0; }
  .picker-title { font-family:inherit;font-size:20px;font-weight:800;color:var(--accent);margin-bottom:10px; }
  .picker-cats { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px; }
  .picker-cat { background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.15s; }
  .picker-cat.active { background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600; }
  .picker-search { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit; }
  .picker-search:focus { border-color:var(--accent); }
  .picker-body { overflow-y:auto;flex:1;padding:12px 20px; }
  .picker-grid { display:flex;flex-direction:column;gap:4px; }
  .picker-item { display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background 0.15s;border:1px solid transparent; }
  .picker-item:hover { background:var(--surface2); }
  .picker-item.selected { background:var(--surface2);border-color:var(--accent); }
  .picker-item.ya-en-lista { opacity:0.5;background:var(--surface2);border-color:var(--accent);pointer-events:none; }
  .picker-item-emoji { font-size:18px;width:24px;text-align:center;flex-shrink:0; }
  .picker-item-nombre { flex:1;font-size:15px;color:var(--text); }
  .picker-item-check { width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all 0.15s; }
  .picker-item.selected .picker-item-check { background:var(--accent);border-color:var(--accent);color:#fff; }
  .picker-item.ya-en-lista .picker-item-check { background:var(--accent);border-color:var(--accent);color:#fff; }
  .picker-footer { padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
  .picker-count { font-size:14px;color:var(--text3); }
  .picker-btn-add { background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:opacity 0.2s; }
  .picker-btn-add:disabled { opacity:0.35;cursor:not-allowed; }
  .picker-btn-cancel { background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:10px;padding:10px 16px;font-family:inherit;font-size:14px;cursor:pointer; }
  .picker-add-btn-inline { background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;margin-left:8px; }
  .picker-add-btn-inline:hover { background:var(--accent);color:#fff;border-color:var(--accent); }

  /* Modal edición de registro */
  .edit-overlay { position:fixed;inset:0;background:rgba(43,26,20,0.45);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto; }
  .edit-modal { background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden; }
  .edit-header { padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
  .edit-title { font-family:inherit;font-size:18px;font-weight:800;color:var(--accent); }
  .edit-body { overflow-y:auto;flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:10px; }
  .edit-footer { padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0; }
  .edit-btn-save { background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer; }
  .edit-btn-delete { background:transparent;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;cursor:pointer; }
  .edit-btn-cancel { background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;cursor:pointer; }
  .edit-row { display:grid;grid-template-columns:1fr 1fr;gap:10px; }

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURACIÓN — editar aquí para cambiar la fuente de datos
// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
// CONFIGURACIÓN DE TIENDAS (estática)
// ══════════════════════════════════════════════════════════════
var CONFIG_TIENDAS = {
  costco:    { clave:'costco',    etiqueta:'Costco',        color:'#1E8E3E', emoji:'🟢' },
  walmart:   { clave:'walmart',   etiqueta:'Walmart',       color:'#2F6FDB', emoji:'🔵' },
  chedraui:  { clave:'chedraui',  etiqueta:'Chedraui',      color:'#D97706', emoji:'🟠' },
  chedpm:    { clave:'chedpm',    etiqueta:'Chedraui P.M.', color:'#0E8C82', emoji:'🔵' },
  aki:       { clave:'aki',       etiqueta:'Super Aki',     color:'#7B5BD6', emoji:'🟣' },
  ml:        { clave:'ml',        etiqueta:'MercadoLibre',  color:'#C9372C', emoji:'🔴' },
  pachamama: { clave:'pachamama', etiqueta:'Pachamama P.M.',color:'#4D8B31', emoji:'🟢' },
  aurrera:   { clave:'aurrera',   etiqueta:'Bodega Aurrera',color:'#A86B00', emoji:'🟡' },
  oceanleader:{ clave:'oceanleader', etiqueta:'Ocean Leader', color:'#1F7FC2', emoji:'🐟' },
  multiproteinas:{ clave:'multiproteinas', etiqueta:'Multiproteínas', color:'#B5482F', emoji:'🥩' },
  similares: { clave:'similares', etiqueta:'Farmacias Similares', color:'#2F8F7F', emoji:'💊' },
  delsol:    { clave:'delsol',    etiqueta:'Tiendas Del Sol', color:'#C2457E', emoji:'🍬' },
  oxxo:      { clave:'oxxo',      etiqueta:'Oxxo',          color:'#C7372B', emoji:'🏪' },
  gomart:    { clave:'gomart',    etiqueta:'GoMart',        color:'#6F6259', emoji:'🏪' },
  velvet:    { clave:'velvet',    etiqueta:'Papelería Velvet', color:'#7A5BC8', emoji:'✏️' },
};

// ── GUÍA DE USO (estática) ────────────────────────────────────
const GUIA = [
  { pregunta: '📸 Tickets', respuesta: 'Tómale foto al ticket completo y súbela a la carpeta Tickets-compras de Drive. Si es largo, en varias fotos seguidas.' },
  { pregunta: '💻 En la laptop', respuesta: 'Claude Code lee las fotos, empata cada renglón con el catálogo, valida contra el total y guarda el ticket. No tienes que revisar tickets.' },
  { pregunta: '❓ Dudas', respuesta: 'Solo cuando un renglón puede ser varias cosas (¿MILANESA de pollo o de res?) te pregunta ahí. Un toque y listo; la respuesta se aprende para la próxima.' },
  { pregunta: '🛒 Lista', respuesta: 'La lista compartida. Cada producto muestra el mejor precio conocido y la ruta sugerida dice en qué tienda conviene cada cosa.' },
  { pregunta: '🔒 Datos de pago', respuesta: 'No se guardan tarjeta, afiliación, autorización ni RFC, y esa parte de la foto se tapa antes de subirla.' },
  { pregunta: '✏️ Corregir', respuesta: 'Toca cualquier artículo en Tickets o Catálogo para editarlo.' },
];

// ══════════════════════════════════════════════════════════════
// VARIABLES GLOBALES
// ══════════════════════════════════════════════════════════════
var TICKETS  = [];
var CATALOGO = [];
var SESIONES = [];

// ══════════════════════════════════════════════════════════════
// CARGA DE DATOS DESDE FIREBASE
// ══════════════════════════════════════════════════════════════

function parsearNumero(valor) {
  if (valor === null || valor === undefined || valor === '') return 0;
  if (typeof valor === 'number') return valor;
  var s = String(valor).trim().replace(/\r/g, '').replace(/[$€\s]/g, '');
  if (s === '' || s === '-') return 0;
  var tieneP = s.indexOf('.') !== -1;
  var tieneC = s.indexOf(',') !== -1;
  if (tieneP && tieneC) {
    s = s.lastIndexOf('.') < s.lastIndexOf(',')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '');
  } else if (tieneC && !tieneP) {
    var partes = s.split(',');
    s = (partes.length === 2 && partes[1].length <= 2)
      ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function setLoadingMsg(msg, pct) {
  var el = document.getElementById('loading-msg');
  var bar = document.getElementById('loading-bar');
  if (el) el.textContent = msg;
  if (bar) bar.style.width = pct + '%';
}

function cargarDatos() {
  setLoadingMsg('Conectando con Firebase...', 10);

  return new Promise(function(resolve, reject) {
    function intentar() {
      if (!window._fbGet) { setTimeout(intentar, 100); return; }
      setLoadingMsg('Cargando datos...', 40);

      Promise.all([
        window._fbGet('tickets'),
        window._fbGet('catalogo'),
        window._fbGet('sesiones'),
      ]).then(function(resultados) {
        var rawTickets  = resultados[0];
        var rawCatalogo = resultados[1];
        var rawSesiones = resultados[2];

       TICKETS = rawTickets
          ? Object.entries(rawTickets).filter(function(e) { return e[1] && e[1].producto; }).map(function(e) { return Object.assign({_key: e[0]}, e[1]); })
          : [];
        CATALOGO = rawCatalogo
          ? Object.entries(rawCatalogo).filter(function(e) { return e[1] && e[1].producto; }).map(function(e) { return Object.assign({_key: e[0]}, e[1]); })
          : [];
        SESIONES = rawSesiones
          ? Object.entries(rawSesiones).filter(function(e) { return e[1] && e[1].tienda; }).map(function(e) { return Object.assign({_key: e[0]}, e[1]); })
          : [];

        // Lo más reciente primero. Las fechas vienen como DD/MM/AAAA y
        // compararlas como texto las desordenaba.
        TICKETS.sort(function(a, b) {
          return fechaISO(b.fecha).localeCompare(fechaISO(a.fecha)) ||
            (a.sesion || a.tienda).localeCompare(b.sesion || b.tienda);
        });
        SESIONES.sort(function(a, b) { return fechaISO(b.fecha).localeCompare(fechaISO(a.fecha)); });

        setLoadingMsg('Listo', 100);
        resolve();
      }).catch(reject);
    }
    intentar();
  });
}

// ══════════════════════════════════════════════════════════════
// FUNCIONES UTILITARIAS
// ══════════════════════════════════════════════════════════════

// "DD/MM/AAAA" -> "AAAA-MM-DD" para ordenar y comparar fechas
function fechaISO(fecha) {
  var m = String(fecha || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return String(fecha || '');
  return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
}

// "DD/MM/AAAA" o "AAAA-MM-DD" -> "13 jul 2026"
function fechaBonita(fecha) {
  var iso = fechaISO(fecha);
  var p = iso.split('-');
  if (p.length !== 3) return fecha || '';
  return (+p[2]) + ' ' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+p[1] - 1] + ' ' + p[0];
}

// "$59.90/kg" dentro de un texto -> 59.9 (o null si no hay precio por kilo)
function precioPorKilo(texto) {
  var m = String(texto || '').match(/\$\s?(\d+(?:\.\d+)?)\s?\/\s?kg/i);
  return m ? parseFloat(m[1]) : null;
}

// "0.550kg · $9.50/kg" -> "0.55 kg × $9.50/kg" para mostrar en el ticket
function detalleGranel(notas) {
  var m = String(notas || '').match(/(\d+(?:\.\d+)?)\s?kg\s*·\s*\$(\d+(?:\.\d+)?)\/kg/i);
  return m ? (+m[1]) + ' kg × $' + (+m[2]).toFixed(2) + '/kg' : '';
}

// Monto redondeado sin centavos: "$49,267"
function pesos(valor) {
  return '$' + Math.round(valor || 0).toLocaleString('es-MX');
}

// Formatea un número como precio en pesos mexicanos
function formatearPrecio(valor) {
  var numero = parseFloat(String(valor).replace(/[$,]/g, ''));
  if (isNaN(numero)) return valor;
  return '$' + numero.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Devuelve la clave de tienda a partir de texto libre
function obtenerClaveTienda(texto) {
  var t = (texto || '').toLowerCase();
  if (t.includes('costco'))  return 'costco';
  if (t.includes('walmart')) return 'walmart';
  if (t.includes('p.m.') || t.includes('663') || t.includes('chedpm')) return 'chedpm';
  if (t.includes('chedraui')) return 'chedraui';
  if (t.includes('aki'))     return 'aki';
  if (t.includes('mercado') || t.includes('online') || t === 'ml') return 'ml';
  return texto; // devuelve la clave tal cual si ya viene limpia
}

// Genera el HTML de un badge de tienda
function renderBadgeTienda(claveTienda) {
  var config = CONFIG_TIENDAS[claveTienda];
  if (!config) return claveTienda ? '<span class="badge">' + claveTienda + '</span>' : '';
  // El color sale de CONFIG_TIENDAS para que una tienda nueva no necesite CSS propio
  return '<span class="badge" style="background:' + config.color + '26;color:' + config.color + '">' + config.etiqueta + '</span>';
}

// Devuelve la clase CSS para colorear una nota según su contenido
function obtenerClaseNota(nota) {
  if (!nota) return '';
  if (nota.includes('✅') || nota.includes('Promo') || nota.includes('promo') || nota.includes('🔖')) return 'note-promo';
  if (nota.includes('⚠️') || nota.includes('❓')) return 'note-warn';
  if (nota.includes('👁️') || nota.includes('Ref.')) return 'note-obs';
  return '';
}

// Tickets: una tarjeta por ticket (sesión); se abre para ver los artículos
function renderTablaTickets(filtroTexto, filtroTienda) {
  var datos = TICKETS;
  if (filtroTexto) {
    var txt = listaNormalizar(filtroTexto);
    datos = datos.filter(function(t) {
      return listaNormalizar([t.producto, t.categoria, t.subcategoria, t.textoTicket].join(' ')).includes(txt);
    });
  }
  if (filtroTienda) datos = datos.filter(function(t) { return t.tienda === filtroTienda; });

  var sesiones = {};
  SESIONES.forEach(function(s) { sesiones[s._key] = s; });

  // Agrupar conservando el orden (ya vienen por fecha, lo más reciente arriba)
  var grupos = [];
  var porClave = {};
  datos.forEach(function(t) {
    var clave = t.sesion || (t.tipo + '|' + t.tienda + '|' + t.fecha);
    if (!porClave[clave]) {
      porClave[clave] = { sesion: sesiones[t.sesion], tienda: t.tienda, fecha: t.fecha, obs: t.tipo === 'observacion', items: [] };
      grupos.push(porClave[clave]);
    }
    porClave[clave].items.push(t);
  });

  var abrir = !!filtroTexto;
  var html = grupos.map(function(g) {
    var suma = g.items.reduce(function(a, t) { return a + t.precio * (t.cantidad || 1); }, 0);
    var total = g.sesion && !filtroTexto ? g.sesion.total : suma;
    var sub = g.obs ? '👁️ precios vistos, sin comprar · ' + g.items.length
                    : g.items.length + (g.items.length === 1 ? ' artículo' : ' artículos');
    if (g.sesion && g.sesion.ahorro) sub += ' · ahorraste ' + formatearPrecio(g.sesion.ahorro);
    if (g.sesion && g.sesion.origen === 'foto') sub += ' · 📸';
    var items = g.items.map(function(t) {
      var granel = detalleGranel(t.notas);
      var det = granel || [t.presentacion, t.cantidad > 1 ? t.cantidad + ' × ' + formatearPrecio(t.precio) : ''].filter(Boolean).join(' · ');
      var promo = /promo|ahorro|rebaja/i.test(t.notas || '') ? ' <span class="tk-promo">· promo</span>' : '';
      return '<div class="tk-item" onclick="editAbrirPorKey(\'tickets\',\'' + t._key + '\')">' +
        '<div><div class="tk-item-nombre">' + esc(t.producto) + '</div>' +
          '<div class="tk-item-det">' + esc(det) + promo + '</div></div>' +
        '<div class="tk-item-precio">' + formatearPrecio(t.precio * (t.cantidad || 1)) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="tk-card' + (abrir ? ' abierto' : '') + '">' +
      '<div class="tk-head" onclick="this.parentNode.classList.toggle(\'abierto\')">' +
        '<div class="tk-head-izq"><div>' + renderBadgeTienda(g.tienda) + ' <span class="tk-sub">' + fechaBonita(g.fecha) + '</span></div>' +
          '<div class="tk-sub">' + sub + '</div></div>' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="tk-total">' + formatearPrecio(total) + '</span><span class="tk-flecha">▼</span></div>' +
      '</div>' +
      '<div class="tk-items">' + items + '</div>' +
    '</div>';
  }).join('');

  var compras = grupos.filter(function(g) { return !g.obs; }).length;
  return {
    conteo: { compras: compras, obs: grupos.length - compras },
    html: '<div class="tk-lista">' + (html || '<div class="vacio">Nada con ese filtro.</div>') + '</div>'
  };
}

// Catálogo: una tarjeta por producto con su precio en cada tienda, el más barato en verde
function renderTablaCatalogo(filtroTexto, filtroTienda) {
  var datos = CATALOGO;
  if (filtroTexto) {
    var txt = listaNormalizar(filtroTexto);
    datos = datos.filter(function(p) {
      return listaNormalizar([p.producto, p.categoria, p.subcategoria].join(' ')).includes(txt);
    });
  }
  if (filtroTienda) datos = datos.filter(function(p) { return obtenerClaveTienda(p.tienda) === filtroTienda; });

  var porProducto = {};
  datos.forEach(function(p) {
    var k = listaNormalizar(p.producto);
    (porProducto[k] = porProducto[k] || []).push(p);
  });
  var productos = Object.keys(porProducto).map(function(k) { return porProducto[k]; });
  productos.sort(function(a, b) {
    return (a[0].categoria || '').localeCompare(b[0].categoria || '', 'es') || a[0].producto.localeCompare(b[0].producto, 'es');
  });

  var catActual = null;
  var html = productos.map(function(filas) {
    filas.sort(function(a, b) { return parsearNumero(a.precio) - parsearNumero(b.precio); });
    var p0 = filas[0];
    var encabezado = '';
    if (p0.categoria !== catActual) {
      catActual = p0.categoria;
      encabezado = '<div class="cat-grupo">' + pickerGetEmoji(catActual) + ' ' + esc(catActual || 'Sin categoría') + '</div>';
    }
    var precios = filas.map(function(p, i) {
      return '<div class="cat-precio' + (i === 0 && filas.length > 1 ? ' cat-mejor' : '') + '" onclick="editAbrirPorKey(\'catalogo\',\'' + p._key + '\')">' +
        '<span>' + renderBadgeTienda(obtenerClaveTienda(p.tienda)) + (p.presentacion && p.presentacion !== '—' ? ' <span class="tk-sub">' + esc(p.presentacion) + '</span>' : '') +
          (p.precioUnidad ? '<span class="tk-sub" style="display:block;margin-top:2px">' + esc(p.precioUnidad) + '</span>' : '') + '</span>' +
        '<b>' + formatearPrecio(p.precio) + '</b>' +
      '</div>';
    }).join('');
    return encabezado + '<div class="cat-card"><div class="cat-nombre">' + esc(p0.producto) + '</div>' +
      '<div class="cat-precios">' + precios + '</div></div>';
  }).join('');

  return { conteo: productos.length, html: '<div class="tk-lista">' + (html || '<div class="vacio">Nada con ese filtro.</div>') + '</div>' };
}

// Resumen: cuánto se gasta, por mes y por tienda
function renderTablaResumen() {
  var total = SESIONES.reduce(function(a, s) { return a + (s.total || 0); }, 0);
  var ahorro = SESIONES.reduce(function(a, s) { return a + (s.ahorro || 0); }, 0);
  var porMes = {}, porTienda = {};
  SESIONES.forEach(function(s) {
    var mes = fechaISO(s.fecha).slice(0, 7);
    porMes[mes] = (porMes[mes] || 0) + (s.total || 0);
    porTienda[s.tienda] = (porTienda[s.tienda] || 0) + (s.total || 0);
  });
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function barras(mapa, etiqueta, orden) {
    var claves = Object.keys(mapa).sort(orden);
    var max = Math.max.apply(null, claves.map(function(k) { return mapa[k]; }).concat([1]));
    return claves.map(function(k) {
      return '<div class="barra-fila"><span>' + etiqueta(k) + '</span>' +
        '<div class="barra"><span style="width:' + Math.round(mapa[k] / max * 100) + '%"></span></div>' +
        '<b>' + pesos(mapa[k]) + '</b></div>';
    }).join('');
  }
  return '<div class="stats">' +
      '<div class="stat"><div class="stat-label">Gastado</div><div class="stat-valor">' + pesos(total) + '</div></div>' +
      '<div class="stat"><div class="stat-label">Ahorrado en promos</div><div class="stat-valor verde">' + pesos(ahorro) + '</div></div>' +
      '<div class="stat"><div class="stat-label">Tickets</div><div class="stat-valor">' + SESIONES.length + '</div></div>' +
    '</div>' +
    '<div class="res-bloque"><div class="res-titulo">Por mes</div>' +
      barras(porMes, function(k) { var p = k.split('-'); return MESES[+p[1] - 1] + ' ' + p[0]; }, function(a, b) { return b.localeCompare(a); }) +
    '</div>' +
    '<div class="res-bloque"><div class="res-titulo">Por tienda</div>' +
      barras(porTienda, function(k) { return (CONFIG_TIENDAS[k] || {}).etiqueta || k; }, function(a, b) { return porTienda[b] - porTienda[a]; }) +
    '</div>';
}

// Configuración de cada sección de la app
var SECCIONES = [
  { id: 'lista',    nombre: 'Lista de compras',  icono: '📋', color: 'var(--accent)', tieneFilters: false },
  { id: 'dudas',    nombre: 'Dudas de tickets',   icono: '❓', color: 'var(--accent)', tieneFilters: false },
  { id: 'tickets',  nombre: 'Tickets',            icono: '🧾', color: 'var(--green)',  tieneFilters: true },
  { id: 'catalogo', nombre: 'Catálogo precios',   icono: '📦', color: 'var(--accent)', tieneFilters: true },
  { id: 'resumen',  nombre: 'Resumen',            icono: '📊', color: 'var(--blue)',   tieneFilters: false },
  { id: 'guia',     nombre: 'Guía de uso',        icono: '📖', color: 'var(--purple)', tieneFilters: false },
];

// Actualiza una sección individual con los filtros actuales
function actualizarSeccion(idSeccion) {
  var contenedor = document.getElementById('tbl-' + idSeccion);
  var contadorEl  = document.getElementById('cnt-' + idSeccion);
  var filtroTexto = (document.getElementById('srch-' + idSeccion) || {}).value || '';
  var filtroTienda = (document.getElementById('tsel-' + idSeccion) || {}).value || '';

  var html = '';
  var conteo = null;

  if (idSeccion === 'lista') {
    // El módulo lista se renderiza con su propio sistema — no usa tabla
    renderModuloLista();
    return;
  } else if (idSeccion === 'dudas') {
    // Igual que la lista: el módulo pinta su propio contenido
    dudasRender();
    return;
  } else if (idSeccion === 'tickets') {
    var resultado = renderTablaTickets(filtroTexto, filtroTienda);
    html = resultado.html;
    conteo = resultado.conteo.compras + ' tickets' + (resultado.conteo.obs ? ' · ' + resultado.conteo.obs + ' de precios vistos' : '');
  } else if (idSeccion === 'catalogo') {
    var resultado = renderTablaCatalogo(filtroTexto, filtroTienda);
    html = resultado.html;
    conteo = resultado.conteo + ' productos';
  } else if (idSeccion === 'resumen') {
    html = renderTablaResumen();
    conteo = SESIONES.length + ' tickets';
  } else if (idSeccion === 'guia') {
    html = renderTablaGuia();
    conteo = '';
  }

  if (contenedor) contenedor.innerHTML = html;
  if (contadorEl && conteo !== null) contadorEl.textContent = conteo;
}

var tabActivo = 'lista';

function navegar(idSeccion) {
  tabActivo = idSeccion;
  // Mostrar solo la sección activa
  SECCIONES.forEach(function(s) {
    var bloque = document.getElementById('bloque-' + s.id);
    if (bloque) bloque.classList.toggle('activa', s.id === idSeccion);
  });
  // Actualizar tab bar
  document.querySelectorAll('.tab-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === idSeccion);
  });
  // Renderizar la sección si es necesario
  actualizarSeccion(idSeccion);
}

function inicializar() {
  // Construir todas las secciones pero solo mostrar la activa
  document.getElementById('sheetsContainer').innerHTML =
    SECCIONES.map(function(s) {
      return '<div id="bloque-' + s.id + '" class="seccion-bloque' + (s.id === tabActivo ? ' activa' : '') + '">' +
        construirBloqueSección(s) +
      '</div>';
    }).join('');
  // Renderizar solo la sección activa al inicio
  actualizarSeccion(tabActivo);
  // Agregar tab bar al DOM
  var tabBar = document.createElement('nav');
  tabBar.className = 'tab-bar';
  tabBar.innerHTML = SECCIONES.map(function(s) {
    return '<button class="tab-item' + (s.id === tabActivo ? ' active' : '') + '" data-tab="' + s.id + '" onclick="navegar(\'' + s.id + '\')">' +
      '<span class="tab-icon">' + s.icono + '</span>' +
      '<span class="tab-label">' + s.nombre.split(' ')[0] + '</span>' +
    '</button>';
  }).join('');
  document.body.appendChild(tabBar);
}

// EXPORTACIÓN CSV — generado desde los datos actuales
// ══════════════════════════════════════════════════════════════
function exportarCSV() {
  var encabezados = ['Fecha', 'Tienda', 'Ciudad', 'Producto', 'Categoría', 'Presentación', 'Precio', 'Cantidad', 'Total', 'Tipo', 'Notas'];

  var filas = TICKETS.map(function(t) {
    var config = CONFIG_TIENDAS[t.tienda] || {};
    var total = (t.precio * t.cantidad).toFixed(2);
    return [
      t.fecha, config.etiqueta || t.tienda, t.ciudad, t.producto,
      t.categoria, t.presentacion, t.precio, t.cantidad, total, t.tipo, t.notas || ''
    ].map(function(campo) {
      // Encerrar en comillas si el campo contiene coma o comillas
      var s = String(campo).replace(/"/g, '""');
      return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s + '"' : s;
    }).join(',');
  });

  var contenidoCSV = encabezados.join(',') + '\n' + filas.join('\n');
  var blob = new Blob(['\uFEFF' + contenidoCSV], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'mandadito_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════════════════════════
// MÓDULO: LISTA DE COMPRAS
// Lee directamente de TICKETS y CATALOGO — sin duplicar datos.
// Estado vive en memoria (sesión); se limpia al recargar.
// ══════════════════════════════════════════════════════════════

var listaItems      = [];   // [{ id, nombre, expandido, checked }]
var listaSugerencias = [];  // sugerencias activas del dropdown
var listaDropIdx    = -1;

// Construye el índice de precios desde TICKETS y CATALOGO en tiempo real.
// Cada entrada: { producto, tienda, precio, nota }
function construirIndicePrecios() {
  var indice = [];

  // Fuente 1: TICKETS (precios reales pagados). En granel el precio guardado
  // es el importe de lo que se pesó; para comparar tiendas se usa el precio
  // por kilo que viene en las notas ("0.550kg · $9.50/kg").
  TICKETS.forEach(function(t) {
    if (!t.producto || !t.precio) return;
    var kilo = precioPorKilo(t.notas);
    indice.push({
      producto: t.producto,
      tienda:   t.tienda,
      precio:   kilo || t.precio,
      nota:     kilo ? 'por kg' : (t.notas || '')
    });
  });

  // Fuente 2: CATALOGO (precios de referencia)
  if (typeof CATALOGO !== 'undefined') {
    CATALOGO.forEach(function(p) {
      if (!p.producto || !p.precio) return;
      var kilo = precioPorKilo(p.precioUnidad);
      indice.push({
        producto: p.producto,
        tienda:   obtenerClaveTienda(p.tienda || ''),
        precio:   kilo || parseFloat(String(p.precio).replace(/[$,]/g, '')) || 0,
        nota:     kilo ? 'por kg' : (p.nota || p.presentacion || '')
      });
    });
  }

  return indice;
}

// Normaliza texto para búsqueda tolerante a acentos y mayúsculas
function listaNormalizar(texto) {
  return (texto || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Busca precios para un nombre dado en el índice
function listaBuscarPrecios(nombre) {
  var indice   = construirIndicePrecios();
  var norm     = listaNormalizar(nombre);
  var palabras = norm.split(/\s+/).filter(function(p) { return p.length >= 4; });

  return indice.filter(function(d) {
    var normProd = listaNormalizar(d.producto);
    if (normProd.includes(norm) || norm.includes(normProd)) return true;
    var hits = palabras.filter(function(p) { return normProd.includes(p); });
    return hits.length >= 2;
  });
}

// Mejor precio por tienda (el más bajo de cada una)
function listaMejorPorTienda(precios) {
  var porTienda = {};
  precios.forEach(function(p) {
    if (!porTienda[p.tienda] || p.precio < porTienda[p.tienda].precio) {
      porTienda[p.tienda] = p;
    }
  });
  return Object.values(porTienda).sort(function(a, b) { return a.precio - b.precio; });
}

// Genera sugerencias para el dropdown
function listaGenerarSugerencias(texto) {
  var indice = construirIndicePrecios();
  var norm   = listaNormalizar(texto);
  if (norm.length < 2) return [];

  var vistos   = {};
  var resultado = [];

  indice.forEach(function(d) {
    var normProd = listaNormalizar(d.producto);
    if (!normProd.includes(norm)) return;
    if (vistos[d.producto]) {
      if (!vistos[d.producto].tiendas.includes(d.tienda)) {
        vistos[d.producto].tiendas.push(d.tienda);
      }
      return;
    }
    var entrada = { nombre: d.producto, tiendas: [d.tienda] };
    vistos[d.producto] = entrada;
    resultado.push(entrada);
  });

  return resultado.slice(0, 8);
}

// ── AUTOCOMPLETE ────────────────────────────────────────────

function listaOnInput(valor) {
  listaDropIdx    = -1;
  listaSugerencias = listaGenerarSugerencias(valor);
  var dd = document.getElementById('lista-dropdown');
  if (!dd) return;

  if (!valor || valor.trim().length < 2) {
    dd.classList.remove('visible');
    dd.innerHTML = '';
    return;
  }

 var html = '';

  // Sugerencias
  html += listaSugerencias.map(function(s, i) {
    var tiendas = s.tiendas.map(function(t) {
      return (CONFIG_TIENDAS[t] || {}).etiqueta || t;
    }).join(', ');
    return '<div class="ldd-item" data-idx="' + i + '" onclick="listaSeleccionar(' + i + ')">' +
      '<span class="ldd-nombre">' + s.nombre + '</span>' +
      '<span class="ldd-meta">' + tiendas + '</span>' +
    '</div>';
  }).join('');

  dd.innerHTML = html;
  dd.classList.add('visible');
}

function listaOnKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    var items = document.querySelectorAll('#lista-dropdown .ldd-item');
    if (listaDropIdx >= 0 && items.length > 0) {
      items[listaDropIdx].click();
    } else {
      listaAgregarLibre();
    }
    return;
  }

  var items = document.querySelectorAll('#lista-dropdown .ldd-item');
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    listaDropIdx = Math.min(listaDropIdx + 1, items.length - 1);
    items.forEach(function(el, i) { el.classList.toggle('ldd-active', i === listaDropIdx); });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    listaDropIdx = Math.max(listaDropIdx - 1, 0);
    items.forEach(function(el, i) { el.classList.toggle('ldd-active', i === listaDropIdx); });
  } else if (e.key === 'Escape') {
    listaCerrarDropdown();
  }
}

function listaCerrarDropdown() {
  var dd = document.getElementById('lista-dropdown');
  if (dd) { dd.classList.remove('visible'); dd.innerHTML = ''; }
  listaDropIdx    = -1;
  listaSugerencias = [];
}

function listaSeleccionar(idx) {
  var s = listaSugerencias[idx];
  if (s) listaAgregar(s.nombre);
}

function listaAgregarLibre() {
  var input = document.getElementById('lista-input');
  if (!input) return;
  var nombre = (input.value || '').trim();
  if (nombre.length >= 1) listaAgregar(nombre);
}

function listaAgregar(nombre) {
  var yaExiste = listaItems.some(function(i) {
    return listaNormalizar(i.nombre) === listaNormalizar(nombre);
  });
  if (!yaExiste) {
    listaItems.push({ id: Date.now(), nombre: nombre, expandido: false, checked: false });
    listaGuardar();
  }
  var input = document.getElementById('lista-input');
  if (input) { input.value = ''; input.focus(); }
  listaCerrarDropdown();
  listaRenderItems();
  listaRenderRuta();
}
function listaToggleExpand(id) {
  var item = listaItems.find(function(i) { return i.id === id; });
  if (item) item.expandido = !item.expandido;
  listaRenderItems();
}

function listaToggleCheck(id) {
  var item = listaItems.find(function(i) { return i.id === id; });
  if (item) { item.checked = !item.checked; listaGuardar(); }
  listaRenderItems();
  listaRenderRuta();
}

function listaEliminar(id) {
  listaItems = listaItems.filter(function(i) { return i.id !== id; });
  listaGuardar();
  listaRenderItems();
  listaRenderRuta();
}

function listaLimpiar() {
  if (!confirm('¿Seguro que quieres limpiar toda la lista?')) return;
  listaItems = [];
  if (window._fbRemove) window._fbRemove();
  listaRenderItems();
  listaRenderRuta();
}

function listaGuardar() {
  if (!window._fbSet) return;
  // Firebase no acepta arrays vacíos — mandar null para limpiar
  window._fbSet(listaItems.length ? listaItems : null);
}

// ══════════════════════════════════════════════════════════════
// MÓDULO: PICKER DE CATÁLOGO
// ══════════════════════════════════════════════════════════════
var pickerSeleccionados = [];
var pickerCatActiva = 'Todos';
var pickerBusqueda = '';

function pickerGetEmoji(categoria) {
  var map = {
    'Frutas y Verduras':'🥦','Carnes y Pescados':'🥩','Lácteos':'🥛',
    'Panadería':'🍞','Alimentos secos':'🌾','Conservas y Salsas':'🥫',
    'Snacks':'🍿','Bebidas':'🧃','Congelados':'🧊','Higiene':'🧴',
    'Hogar':'🧹','Farmacia':'💊','Mascotas':'🐾','Cosméticos':'✨',
    'Electrónica':'🔋','Ferretería':'🔧','Ropa y calzado':'👕',
    'Papelería':'✏️','Flores y Plantas':'🌱','Autos':'🚗',
    'Servicios':'🔧','Varios':'📦','Por identificar':'❓'
  };
  return map[categoria] || '🛒';
}

function pickerProductosUnicos() {
  var vistos = {};
  CATALOGO.forEach(function(p) {
    var key = p.producto.trim().toLowerCase();
    if (!vistos[key]) vistos[key] = p;
  });
  return Object.values(vistos).sort(function(a, b) {
    return a.categoria.localeCompare(b.categoria) || a.producto.localeCompare(b.producto);
  });
}

function pickerCategorias() {
  var cats = new Set();
  pickerProductosUnicos().forEach(function(p) { cats.add(p.categoria); });
  return ['Todos'].concat(Array.from(cats).sort());
}

function pickerFiltrar() {
  var prods = pickerProductosUnicos();
  if (pickerCatActiva !== 'Todos') {
    prods = prods.filter(function(p) { return p.categoria === pickerCatActiva; });
  }
  if (pickerBusqueda.trim()) {
    var norm = pickerBusqueda.toLowerCase();
    prods = prods.filter(function(p) {
      return p.producto.toLowerCase().includes(norm) || (p.subcategoria||'').toLowerCase().includes(norm);
    });
  }
  return prods;
}

function pickerAbrir() {
  pickerSeleccionados = [];
  pickerCatActiva = 'Todos';
  pickerBusqueda = '';
  var overlay = document.createElement('div');
  overlay.className = 'picker-overlay';
  overlay.id = 'picker-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) pickerCerrar(); };
  overlay.innerHTML = pickerRenderHTML();
  document.body.appendChild(overlay);
}

function pickerRenderHTML() {
  var cats = pickerCategorias();
  var prods = pickerFiltrar();
  var yaEnLista = listaItems.map(function(i) { return listaNormalizar(i.nombre); });
  var nSel = pickerSeleccionados.length;

  var catsHTML = cats.map(function(c) {
    return '<button class="picker-cat' + (c === pickerCatActiva ? ' active' : '') +
      '" onclick="pickerSetCat(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
  }).join('');

  var itemsHTML = prods.map(function(p) {
    var norm = listaNormalizar(p.producto);
    var yaEsta = yaEnLista.includes(norm);
    var selIdx = pickerSeleccionados.indexOf(p.producto);
    var sel = selIdx !== -1;
    var cls = 'picker-item' + (yaEsta ? ' ya-en-lista' : sel ? ' selected' : '');
    var check = (yaEsta || sel) ? '✓' : '';
    return '<div class="' + cls + '" onclick="pickerToggle(\'' + p.producto.replace(/'/g, "\\'") + '\')">' +
      '<span class="picker-item-emoji">' + pickerGetEmoji(p.categoria) + '</span>' +
      '<span class="picker-item-nombre">' + p.producto + '</span>' +
      '<span class="picker-item-check">' + check + '</span>' +
    '</div>';
  }).join('');

  if (!itemsHTML) itemsHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px;">Sin resultados</div>';

  return '<div class="picker-modal">' +
    '<div class="picker-header">' +
      '<div class="picker-title">📦 Catálogo de productos</div>' +
      '<div class="picker-cats">' + catsHTML + '</div>' +
      '<input class="picker-search" placeholder="Buscar producto…" value="' + pickerBusqueda + '" ' +
        'oninput="pickerBuscar(this.value)" autocomplete="off">' +
    '</div>' +
    '<div class="picker-body"><div class="picker-grid">' + itemsHTML + '</div></div>' +
    '<div class="picker-footer">' +
      '<span class="picker-count">' + (nSel > 0 ? nSel + ' seleccionado' + (nSel>1?'s':'') : 'Toca productos para seleccionar') + '</span>' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="picker-btn-cancel" onclick="pickerCerrar()">Cancelar</button>' +
        '<button class="picker-btn-add" onclick="pickerConfirmar()" ' + (nSel===0?'disabled':'') + '>Agregar ' + (nSel>0?nSel+' producto'+(nSel>1?'s':''):'') + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function pickerRefresh() {
  var overlay = document.getElementById('picker-overlay');
  if (!overlay) return;

  // Solo actualizar grid e items, no todo el modal (evita perder el foco del input)
  var prods = pickerFiltrar();
  var yaEnLista = listaItems.map(function(i) { return listaNormalizar(i.nombre); });
  var nSel = pickerSeleccionados.length;

  var itemsHTML = prods.map(function(p) {
    var norm = listaNormalizar(p.producto);
    var yaEsta = yaEnLista.includes(norm);
    var sel = pickerSeleccionados.indexOf(p.producto) !== -1;
    var cls = 'picker-item' + (yaEsta ? ' ya-en-lista' : sel ? ' selected' : '');
    var check = (yaEsta || sel) ? '✓' : '';
    return '<div class="' + cls + '" onclick="pickerToggle(\'' + p.producto.replace(/'/g, "\\'") + '\')">' +
      '<span class="picker-item-emoji">' + pickerGetEmoji(p.categoria) + '</span>' +
      '<span class="picker-item-nombre">' + p.producto + '</span>' +
      '<span class="picker-item-check">' + check + '</span>' +
    '</div>';
  }).join('');

  if (!itemsHTML) itemsHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px;">Sin resultados</div>';

  var grid = overlay.querySelector('.picker-grid');
  if (grid) grid.innerHTML = itemsHTML;

  // Actualizar contador y botón sin tocar el input
  var count = overlay.querySelector('.picker-count');
  if (count) count.textContent = nSel > 0 ? nSel + ' seleccionado' + (nSel > 1 ? 's' : '') : 'Toca productos para seleccionar';

  var btn = overlay.querySelector('.picker-btn-add');
  if (btn) {
    btn.disabled = nSel === 0;
    btn.textContent = nSel > 0 ? 'Agregar ' + nSel + ' producto' + (nSel > 1 ? 's' : '') : 'Agregar';
  }

  // Actualizar categorías activas sin recrearlas
  overlay.querySelectorAll('.picker-cat').forEach(function(el) {
    el.classList.toggle('active', el.textContent === pickerCatActiva);
  });
}

function pickerSetCat(cat) {
  pickerCatActiva = cat;
  pickerRefresh();
}

function pickerBuscar(val) {
  pickerBusqueda = val;
  pickerRefresh();
}

function pickerToggle(nombre) {
  var idx = pickerSeleccionados.indexOf(nombre);
  if (idx === -1) pickerSeleccionados.push(nombre);
  else pickerSeleccionados.splice(idx, 1);
  pickerRefresh();
}

function pickerConfirmar() {
  pickerSeleccionados.forEach(function(nombre) {
    var yaExiste = listaItems.some(function(i) {
      return listaNormalizar(i.nombre) === listaNormalizar(nombre);
    });
    if (!yaExiste) {
      listaItems.push({ id: Date.now() + Math.random(), nombre: nombre, expandido: false, checked: false });
    }
  });
  listaGuardar();
  listaRenderItems();
  listaRenderRuta();
  pickerCerrar();
}

function pickerCerrar() {
  var overlay = document.getElementById('picker-overlay');
  if (overlay) overlay.remove();
}
  
function listaIniciarSync() {
  if (!window._fbListen) return;
  window._fbListen(function(data) {
    listaItems = data ? Object.keys(data).map(function(k) { return data[k]; }) : [];
    listaRenderItems();
    listaRenderRuta();
  });
}

// Arrancar sync cuando Firebase esté listo
function intentarSync() {
  if (window._fbListen && document.getElementById('lista-items-cont')) {
    listaIniciarSync();
  } else {
    setTimeout(intentarSync, 200);
  }
}
// Esperar a que inicializar() haya construido el DOM
setTimeout(intentarSync, 800);
// ── RENDER ITEMS ─────────────────────────────────────────────

function listaRenderItems() {
  var cont = document.getElementById('lista-items-cont');
  if (!cont) return;

  if (listaItems.length === 0) {
    cont.innerHTML = '<div class="lista-vacia">La lista está vacía — escribe un producto arriba</div>';
    return;
  }
  
  if (window._sortable) { window._sortable.destroy(); }
  
  cont.innerHTML = listaItems.map(function(item) {
    var precios  = listaBuscarPrecios(item.nombre);
    var mejores  = listaMejorPorTienda(precios);
    var hayPrec  = mejores.length > 0;
    var mejor    = hayPrec ? mejores[0] : null;

    var preciosHTML = hayPrec
      ? '<div class="litem-precios-label">Precios conocidos — mejor primero</div>' +
        mejores.map(function(p, i) {
          var cfg     = CONFIG_TIENDAS[p.tienda] || {};
          var esMejor = i === 0;
          return '<div class="lprecio-fila">' +
            '<div class="lprecio-tienda">' +
              '<div class="lprecio-dot" style="background:' + (cfg.color || '#999') + '"></div>' +
              '<span class="lprecio-tienda-nom">' + (cfg.etiqueta || p.tienda) + '</span>' +
              (esMejor ? '<span class="lprecio-mejor-badge">mejor precio</span>' : '') +
            '</div>' +
            '<div class="lprecio-der">' +
              '<div class="lprecio-monto' + (esMejor ? ' lprecio-es-mejor' : '') + '">' + formatearPrecio(p.precio) + '</div>' +
              (p.nota ? '<div class="lprecio-nota">' + p.nota + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="litem-sin-precios">Sin datos de precio para este artículo todavía.</div>';

    return '<div class="litem-card">' +
      '<div class="litem-header">' +
        '<div class="litem-drag">⠿</div>' +
        '<div class="litem-check' + (item.checked ? ' litem-checked' : '') + '" onclick="listaToggleCheck(' + item.id + ')">' +
          (item.checked ? '✓' : '') +
        '</div>' +
        '<span class="litem-nombre' + (item.checked ? ' litem-tachado' : '') + '" onclick="listaToggleExpand(' + item.id + ')">' +
          item.nombre +
        '</span>' +
        (hayPrec && !item.checked ? '<span class="litem-mejor">' + formatearPrecio(mejor.precio) + '</span>' : '') +
        '<button class="litem-expand" onclick="listaToggleExpand(' + item.id + ')">' + (item.expandido ? '▲' : '▼') + '</button>' +
        '<button class="litem-remove" onclick="listaEliminar(' + item.id + ')">×</button>' +
      '</div>' +
      '<div class="litem-precios' + (item.expandido ? ' litem-abierto' : '') + '">' + preciosHTML + '</div>' +
    '</div>';
  }).join('');
  window._sortable = Sortable.create(cont, {
    animation: 150,
    handle: '.litem-drag',
    onEnd: function(evt) {
      var item = listaItems.splice(evt.oldIndex, 1)[0];
      listaItems.splice(evt.newIndex, 0, item);
      listaGuardar();
    }
  });
}

// ── RENDER RUTA ──────────────────────────────────────────────

function listaRenderRuta() {
  var cont        = document.getElementById('lista-ruta-cont');
  if (!cont) return;
  var activos     = listaItems.filter(function(i) { return !i.checked; });

  if (activos.length === 0) {
    cont.innerHTML = '<div class="ruta-vacia">Agrega ítems para ver la ruta óptima</div>';
    return;
  }

  var asignaciones = {};
  var sinPrecio    = [];

  activos.forEach(function(item) {
    var mejores = listaMejorPorTienda(listaBuscarPrecios(item.nombre));
    if (mejores.length === 0) { sinPrecio.push(item.nombre); return; }
    var mejor = mejores[0];
    if (!asignaciones[mejor.tienda]) asignaciones[mejor.tienda] = [];
    asignaciones[mejor.tienda].push({ nombre: item.nombre, precio: mejor.precio });
  });

  var tiendas = Object.keys(asignaciones).sort(function(a, b) {
    return asignaciones[b].length - asignaciones[a].length;
  });

  if (tiendas.length === 0) {
    cont.innerHTML = '<div class="ruta-vacia">Ningún ítem tiene datos de precio aún.</div>';
    return;
  }

  var totalEstimado = 0;
  tiendas.forEach(function(t) {
    asignaciones[t].forEach(function(i) { totalEstimado += i.precio; });
  });

  var html = tiendas.map(function(clave) {
    var cfg      = CONFIG_TIENDAS[clave] || {};
    var items    = asignaciones[clave];
    var subtotal = items.reduce(function(acc, i) { return acc + i.precio; }, 0);

    return '<div class="ruta-tienda-bloque">' +
      '<div class="ruta-tienda-hdr">' +
        '<div class="ruta-tienda-izq">' +
          '<div class="ruta-tdot" style="background:' + (cfg.color || '#999') + '"></div>' +
          '<span class="ruta-tnombre">' + (cfg.etiqueta || clave) + '</span>' +
          '<span class="ruta-tcuenta">· ' + items.length + ' ítem' + (items.length > 1 ? 's' : '') + '</span>' +
        '</div>' +
        '<span class="ruta-tsubtotal">' + formatearPrecio(subtotal) + '</span>' +
      '</div>' +
      '<div class="ruta-items-det">' +
        items.map(function(i) {
          var nom = i.nombre.length > 28 ? i.nombre.substring(0, 28) + '…' : i.nombre;
          return '<div class="ruta-item-lin">' +
            '<span class="ruta-item-lin-nom">' + nom + '</span>' +
            '<span class="ruta-item-lin-precio">' + formatearPrecio(i.precio) + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  if (sinPrecio.length > 0) {
    html += '<div class="ruta-sin-datos">⚠ Sin datos: ' + sinPrecio.join(' · ') + '</div>';
  }

  html += '<div class="ruta-total-bar">' +
    '<span class="ruta-total-label">Total estimado</span>' +
    '<span class="ruta-total-valor">' + formatearPrecio(totalEstimado) + '</span>' +
  '</div>';

  cont.innerHTML = html;
}

function editRecopilarDatos() {
  var r = editRegistro;
  var esTicket = editTipo === 'tickets';
  var datos = {
    _key:        r._key,
    producto:    document.getElementById('edit-producto').value.trim(),
    categoria:   document.getElementById('edit-categoria').value.trim(),
    subcategoria:document.getElementById('edit-subcategoria').value.trim(),
    tienda:      document.getElementById('edit-tienda').value,
    ciudad:      document.getElementById('edit-ciudad').value.trim(),
    precio:      parseFloat(document.getElementById('edit-precio').value) || 0,
    notas:       document.getElementById('edit-notas').value.trim(),
  };
  if (esTicket) {
    datos.fecha    = document.getElementById('edit-fecha').value.trim();
    datos.tipo     = document.getElementById('edit-tipo').value;
    datos.cantidad = parseInt(document.getElementById('edit-cantidad').value) || 1;
  } else {
    datos.precioUnidad = document.getElementById('edit-precioUnidad').value.trim();
    datos.presentacion = document.getElementById('edit-presentacion').value.trim();
  }
  return datos;
}

function editGuardar() {
  var datos         = editRecopilarDatos();
  var nombreOriginal = editRegistro.producto;
  var nombreNuevo    = datos.producto;
  var cambioNombre   = nombreOriginal !== nombreNuevo;

  if (cambioNombre) {
    // Contar cuántos registros tienen el nombre original
    var enTickets  = TICKETS.filter(function(t)  { return t.producto === nombreOriginal; }).length;
    var enCatalogo = CATALOGO.filter(function(c) { return c.producto === nombreOriginal; }).length;
    var total      = enTickets + enCatalogo;

    if (total > 1) {
      // Mostrar panel de consistencia dentro del modal
      editMostrarConsistencia(datos, nombreOriginal, nombreNuevo, enTickets, enCatalogo);
      return;
    }
  }
  // Sin conflicto — guardar directo
  editEscribir(datos, false, nombreOriginal);
}

function editMostrarConsistencia(datos, nombreOriginal, nombreNuevo, enTickets, enCatalogo) {
  var body = document.querySelector('#edit-overlay .edit-body');
  if (!body) return;
  // Agregar panel de consistencia al final
  var panel = document.createElement('div');
  panel.className = 'edit-consistencia';
  panel.id = 'edit-panel-consistencia';
  panel.innerHTML =
    '<div class="edit-consistencia-title">⚠️ Cambio de nombre detectado</div>' +
    '<div class="edit-consistencia-msg">' +
      'Encontré <strong>' + (enTickets + enCatalogo) + ' registros</strong> con el nombre ' +
      '"' + nombreOriginal + '" (' + enTickets + ' tickets · ' + enCatalogo + ' en catálogo).<br><br>' +
      '¿Qué quieres hacer?' +
    '</div>' +
    '<div class="edit-consistencia-btns">' +
      '<button class="edit-cons-btn solo" onclick="editEscribir(editDatosPendientes, false, \'' + nombreOriginal.replace(/'/g,"\\'") + '\')">Solo este</button>' +
      '<button class="edit-cons-btn todos" onclick="editEscribir(editDatosPendientes, true, \'' + nombreOriginal.replace(/'/g,"\\'") + '\')">Modificar todos (' + (enTickets + enCatalogo) + ')</button>' +
    '</div>';
  body.appendChild(panel);
  panel.scrollIntoView({ behavior: 'smooth' });
  window.editDatosPendientes = datos;
}

function editEscribir(datos, todos, nombreOriginal) {
  if (!window._fbWrite) { alert('Firebase no está listo'); return; }
  var key = datos._key;
  // Se parte del registro original para no perder campos que el formulario
  // no muestra (codigo, sesion, textoTicket): _fbWrite reemplaza el nodo completo.
  var payload = Object.assign({}, editRegistro, datos);
  delete payload._key;

  if (todos) {
    // Batch update — todos los registros con nombreOriginal
    TICKETS.forEach(function(t) {
      if (t.producto === nombreOriginal) {
        var p = Object.assign({}, t, { producto: datos.producto });
        delete p._key;
        window._fbWrite('tickets/' + t._key, p);
        t.producto = datos.producto; // actualizar en memoria
      }
    });
    CATALOGO.forEach(function(c) {
      if (c.producto === nombreOriginal) {
        var p = Object.assign({}, c, { producto: datos.producto });
        delete p._key;
        window._fbWrite('catalogo/' + c._key, p);
        c.producto = datos.producto;
      }
    });
  } else {
    // Solo este registro
    window._fbWrite(editTipo + '/' + key, payload);
    // Actualizar en memoria
    var arr = editTipo === 'tickets' ? TICKETS : CATALOGO;
    var idx = arr.findIndex(function(r) { return r._key === key; });
    if (idx !== -1) Object.assign(arr[idx], datos);
  }

  editCerrar();
  // Re-renderizar la sección activa
  actualizarSeccion(tabActivo);
}

function editEliminar() {
  if (!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
  if (!window._fbWrite) return;
  // Usar remove via set a null
  window._fbWrite(editTipo + '/' + editRegistro._key, null);
  // Quitar de memoria
  var arr = editTipo === 'tickets' ? TICKETS : CATALOGO;
  var idx = arr.findIndex(function(r) { return r._key === editRegistro._key; });
  if (idx !== -1) arr.splice(idx, 1);
  editCerrar();
  actualizarSeccion(tabActivo);
}

function editCerrar() {
  var o = document.getElementById('edit-overlay');
  if (o) o.remove();
  editRegistro = null;
  editTipo     = null;
  window.editDatosPendientes = null;
}

function regProductoInput(idx, valor) {
  regItems[idx].producto = valor;

  regAcIdx = -1;

  var dd = document.getElementById('reg-ac-' + idx);

    return p.producto.toLowerCase().includes(norm);
  }).slice(0, 7);
  if (!regAcItems.length) {
    dd.innerHTML =
      '<div style="padding:8px 12px;font-size:11px;color:var(--text3);">Sin resultados para "' + valor + '"</div>' +
      '<div onmousedown="regResolverItem(' + idx + ')" ' +

        '🔍 Ver todo el catálogo' +
      '</div>';

    return;
  }

    '</div>';
  }).join('');

    dd.innerHTML += '<div onmousedown="regNuevoProducto(' + idx + ',\'' + valor.replace(/'/g,"\\'") + '\')" ' +

      '＋ Agregar <strong style=\'margin:0 4px;\'>"' + valor + '"</strong> como producto nuevo' +
